name: Build handbook (Docusaurus)

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *" # every hour, to pick up changes in the main project
  workflow_dispatch: # the "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Step 1: get the data the main project publishes, add the sample wireframes
      - run: python scripts/prepare_data.py docusaurus/src/data/handbook.json docusaurus/static/wireframes
      # Step 2: Docusaurus turns the data into the website
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json
      - run: npm ci
        working-directory: docusaurus
      - run: npm run build
        working-directory: docusaurus
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docusaurus/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
